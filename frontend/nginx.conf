server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts uploads up to 2 MiB. Base64 JSON uploads are larger
    # on the wire, so allow a small amount of encoding overhead at the proxy.
    client_max_body_size 4m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep API traffic same-origin. This preserves normal browser cookie
    # behavior without exposing the backend's Docker-only port to the host.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;

        # Nginx forwards Set-Cookie by default; spelling it out makes the
        # same-origin authentication contract obvious to future changes.
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 65s;
    }

    # Vite produces a single-page application. Unknown client-side routes
    # must return the entry document instead of an Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
